<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>zakusone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="zakusone_icon.jpg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1b1b1f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .zakusone-wrap {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 90px;
    height: 90px;
  }

  .zakusone-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }

  .zakusone-hitbox {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  .zakusone-hitbox.cooldown {
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <div class="zakusone-wrap">
    <img src="zakusone.jpg" alt="zakusone">
    <button class="zakusone-hitbox" id="zakuBtn" aria-label="Play zakusone sound"></button>
  </div>

  <script>
    const btn = document.getElementById('zakuBtn');
    const sounds = [
      'zakusone_audio_1.mp3',
      'zakusone_audio_2.mp3',
      'zakusone_audio_3.mp3'
    ];

    let lastIndex = -1;
    let onCooldown = false;

    function pickRandomIndex() {
      if (sounds.length === 1) return 0;
      let idx;
      do {
        idx = Math.floor(Math.random() * sounds.length);
      } while (idx === lastIndex);
      return idx;
    }

    btn.addEventListener('click', () => {
      if (onCooldown) return;

      const idx = pickRandomIndex();
      lastIndex = idx;

      const audio = new Audio(sounds[idx]);

      onCooldown = true;
      btn.classList.add('cooldown');

      audio.play().catch(err => {
        // If playback fails (e.g. blocked), release the lock immediately
        console.error('Playback failed:', err);
        onCooldown = false;
        btn.classList.remove('cooldown');
      });

      audio.addEventListener('ended', () => {
        setTimeout(() => {
          onCooldown = false;
          btn.classList.remove('cooldown');
        }, 1000);
      });
    });
  </script>

</body>
</html>
